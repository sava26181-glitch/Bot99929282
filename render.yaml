services:
  - type: worker
    name: zenodrop-tiktok-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: INSERT_AT_SECONDS
        value: "5"
      - key: BANNER_DURATION
        value: "4"
      - key: MAX_VIDEO_MB
        value: "49"
      - key: HEADLESS
        value: "true"

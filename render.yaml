services:
  - type: web
    name: tiktok-manager-bot
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: HEADLESS
        value: "true"
      - key: PORT
        value: "10000"
